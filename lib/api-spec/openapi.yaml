openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AgroMarket Nigeria marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product discovery and seller listings
  - name: farms
    description: Verified farm profiles
  - name: cart
    description: Persistent shopping cart
  - name: orders
    description: Checkout and fulfilment
  - name: payments
    description: Payment methods and secure payment confirmation
  - name: seller
    description: Seller dashboard and inventory
  - name: quotations
    description: Business buyer bulk quotations
  - name: account
    description: User profiles and marketplace roles
  - name: admin
    description: Marketplace administration and moderation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /account:
    get:
      operationId: getAccount
      tags: [account]
      summary: Get the signed-in account and its marketplace roles
      responses:
        "200":
          description: Account profile and roles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /account/roles:
    post:
      operationId: requestAccountRole
      tags: [account]
      summary: Add a non-admin marketplace role to the signed-in account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountRoleInput" }
      responses:
        "200":
          description: Updated account roles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: Search and filter marketplace products
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: category
          schema: { $ref: "#/components/schemas/ProductCategory" }
        - in: query
          name: location
          schema: { type: string }
        - in: query
          name: sort
          schema:
            type: string
            enum: [relevance, price_asc, price_desc]
      responses:
        "200":
          description: Matching products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product listing for the signed-in seller
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product with seller and farm details
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { description: Product not found }
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a seller-owned product listing
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdate" }
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /farms/featured:
    get:
      operationId: listFeaturedFarms
      tags: [farms]
      summary: List verified farms featured on the home page
      responses:
        "200":
          description: Featured verified farms
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Farm" }
  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get the signed-in buyer's persistent cart
      responses:
        "200":
          description: Current cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
  /cart/items:
    post:
      operationId: addCartItem
      tags: [cart]
      summary: Add a product to the signed-in buyer's cart
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartItemInput" }
      responses:
        "201":
          description: Cart item added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
  /cart/items/{id}:
    patch:
      operationId: updateCartItem
      tags: [cart]
      summary: Change a cart item's quantity
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartItemUpdate" }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
    delete:
      operationId: removeCartItem
      tags: [cart]
      summary: Remove a cart item
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
  /checkout:
    post:
      operationId: checkout
      tags: [orders]
      summary: Validate stock and start sandbox or Paystack checkout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutInput" }
      responses:
        "201":
          description: Seller-specific orders created for this multi-seller checkout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResult" }
        "409": { description: One or more products are no longer available }
  /payments/methods:
    get:
      operationId: getPaymentMethods
      tags: [payments]
      summary: List checkout methods available in this environment
      responses:
        "200":
          description: Configured checkout methods
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentMethods" }
  /payments/paystack/verify:
    post:
      operationId: verifyPaystackPayment
      tags: [payments]
      summary: Verify a Paystack payment for the signed-in buyer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaystackVerificationInput" }
      responses:
        "200":
          description: Verified payment and related seller orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentVerification" }
        "404": { description: Payment reference not found }
        "409": { description: Payment does not belong to the signed-in buyer }
  /payments/paystack/webhook:
    post:
      operationId: receivePaystackWebhook
      tags: [payments]
      summary: Receive signed Paystack transaction events
      description: This endpoint verifies x-paystack-signature against the raw request body before processing.
      responses:
        "200": { description: Event acknowledged }
        "401": { description: Invalid webhook signature }
        "503": { description: Paystack secret is not configured }
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders for the signed-in buyer
      responses:
        "200":
          description: Buyer orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
  /orders/disputes:
    get:
      operationId: listBuyerDisputes
      tags: [orders]
      summary: List disputes opened by the signed-in buyer
      responses:
        "200":
          description: Buyer disputes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrderDispute" }
  /orders/{id}/disputes:
    post:
      operationId: createOrderDispute
      tags: [orders]
      summary: Open a dispute for one of the buyer's orders
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderDisputeInput" }
      responses:
        "201":
          description: Dispute opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderDispute" }
        "404": { description: Eligible order not found }
        "409": { description: A dispute already exists for this order }
  /seller/dashboard:
    get:
      operationId: getSellerDashboard
      tags: [seller]
      summary: Get seller inventory and order summary
      responses:
        "200":
          description: Seller overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerDashboard" }
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get marketplace moderation and transaction overview
      responses:
        "200":
          description: Admin overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboard" }
  /admin/verifications:
    get:
      operationId: listSellerVerifications
      tags: [admin]
      summary: List seller verification applications
      responses:
        "200":
          description: Seller verification cases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VerificationCase" }
  /admin/verifications/{id}/status:
    patch:
      operationId: updateSellerVerification
      tags: [admin]
      summary: Approve or reject a seller verification application
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerificationStatusUpdate" }
      responses:
        "200":
          description: Updated verification case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationCase" }
  /admin/disputes:
    get:
      operationId: listAdminDisputes
      tags: [admin]
      summary: List marketplace order disputes
      responses:
        "200":
          description: Disputes for admin review
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrderDispute" }
  /admin/disputes/{id}:
    patch:
      operationId: updateOrderDispute
      tags: [admin]
      summary: Review or resolve an order dispute
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderDisputeUpdate" }
      responses:
        "200":
          description: Updated dispute
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderDispute" }
  /seller/orders/{id}/status:
    patch:
      operationId: updateSellerOrderStatus
      tags: [seller]
      summary: Update the fulfilment state of a seller order
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderStatusUpdate" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /quotations:
    get:
      operationId: listQuotations
      tags: [quotations]
      summary: List quotations requested by the signed-in business buyer
      responses:
        "200":
          description: Quotations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Quotation" }
    post:
      operationId: createQuotation
      tags: [quotations]
      summary: Request a bulk quotation from sellers
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuotationInput" }
      responses:
        "201":
          description: Quotation request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quotation" }
  /seller/quotations:
    get:
      operationId: listSellerQuotations
      tags: [seller, quotations]
      summary: List bulk quote requests containing this seller's products
      responses:
        "200":
          description: Requests for this seller
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Quotation" }
  /seller/quotations/{id}/response:
    post:
      operationId: respondToQuotation
      tags: [seller, quotations]
      summary: Submit or update this seller's quote for a bulk request
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuotationResponseInput" }
      responses:
        "200":
          description: Seller quote saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotationResponse" }
        "404": { description: Quote request not found for this seller }
        "409": { description: Quote request is already closed }
  /quotations/{id}/responses/{responseId}:
    patch:
      operationId: updateQuotationResponse
      tags: [quotations]
      summary: Accept a quote into an order or decline the seller response
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: responseId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuotationResponseUpdate" }
      responses:
        "200":
          description: Seller response decision and any resulting checkout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotationDecisionResult" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AccountRole:
      type: string
      enum: [consumer, farmer, supplier, business_buyer, admin]
    Account:
      type: object
      properties:
        id: { type: integer }
        displayName: { type: string }
        roles:
          type: array
          items: { $ref: "#/components/schemas/AccountRole" }
      required: [id, displayName, roles]
    AccountRoleInput:
      type: object
      properties:
        role:
          type: string
          enum: [farmer, supplier, business_buyer]
        businessName: { type: string }
        location: { type: string }
      required: [role]
    ProductCategory:
      type: string
      enum: [produce, foodstuff, feeds, seeds, fertilizers, equipment]
    ProductUnit:
      type: string
      enum: [kg, bag, crate, litre, tonne, piece]
    ProductTier:
      type: object
      properties:
        minQuantity: { type: integer }
        unitPrice: { type: number }
      required: [minQuantity, unitPrice]
    Product:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        category: { $ref: "#/components/schemas/ProductCategory" }
        unit: { $ref: "#/components/schemas/ProductUnit" }
        price: { type: number }
        minOrder: { type: integer }
        stock: { type: integer }
        imageUrl: { type: string }
        location: { type: string }
        sellerId: { type: string }
        sellerName: { type: string }
        farmName: { type: string }
        verified: { type: boolean }
        rating: { type: number }
        wholesaleTiers:
          type: array
          items: { $ref: "#/components/schemas/ProductTier" }
      required: [id, name, description, category, unit, price, minOrder, stock, imageUrl, location, sellerId, sellerName, farmName, verified, rating, wholesaleTiers]
    ProductInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        description: { type: string }
        category: { $ref: "#/components/schemas/ProductCategory" }
        unit: { $ref: "#/components/schemas/ProductUnit" }
        price: { type: number, exclusiveMinimum: 0 }
        minOrder: { type: integer, minimum: 1 }
        stock: { type: integer, minimum: 0 }
        imageUrl: { type: string }
        location: { type: string }
        farmName: { type: string }
        wholesaleTiers:
          type: array
          items: { $ref: "#/components/schemas/ProductTier" }
      required: [name, description, category, unit, price, minOrder, stock, imageUrl, location, farmName]
    ProductUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        description: { type: string }
        category: { $ref: "#/components/schemas/ProductCategory" }
        unit: { $ref: "#/components/schemas/ProductUnit" }
        price: { type: number, exclusiveMinimum: 0 }
        minOrder: { type: integer, minimum: 1 }
        stock: { type: integer, minimum: 0 }
        imageUrl: { type: string }
        location: { type: string }
        wholesaleTiers:
          type: array
          items: { $ref: "#/components/schemas/ProductTier" }
    Farm:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        location: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        sellerName: { type: string }
        verified: { type: boolean }
        productCount: { type: integer }
      required: [id, name, location, description, imageUrl, sellerName, verified, productCount]
    CartItem:
      type: object
      properties:
        id: { type: integer }
        productId: { type: integer }
        name: { type: string }
        imageUrl: { type: string }
        unit: { $ref: "#/components/schemas/ProductUnit" }
        unitPrice: { type: number }
        quantity: { type: integer }
        stock: { type: integer }
        sellerName: { type: string }
      required: [id, productId, name, imageUrl, unit, unitPrice, quantity, stock, sellerName]
    Cart:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CartItem" }
        sellerCount: { type: integer }
        subtotal: { type: number }
      required: [items, sellerCount, subtotal]
    CartItemInput:
      type: object
      properties:
        productId: { type: integer }
        quantity: { type: integer, minimum: 1 }
      required: [productId, quantity]
    CartItemUpdate:
      type: object
      properties:
        quantity: { type: integer, minimum: 1 }
      required: [quantity]
    OrderItem:
      type: object
      properties:
        productId: { type: integer }
        name: { type: string }
        unit: { $ref: "#/components/schemas/ProductUnit" }
        unitPrice: { type: number }
        quantity: { type: integer }
        sellerName: { type: string }
      required: [productId, name, unit, unitPrice, quantity, sellerName]
    OrderStatus:
      type: string
      enum: [pending_payment, paid, processing, in_transit, delivered, cancelled]
    Order:
      type: object
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        sellerName: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        paymentStatus: { type: string, enum: [pending, paid, failed] }
        paymentMode: { type: string, enum: [sandbox, provider_pending] }
        total: { type: number }
        deliveryAddress: { type: string }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
      required: [id, orderNumber, sellerName, status, paymentStatus, paymentMode, total, deliveryAddress, createdAt, items]
    CheckoutResult:
      type: object
      properties:
        orderGroupNumber: { type: string }
        grandTotal: { type: number }
        status: { type: string, enum: [pending, paid, failed] }
        authorizationUrl: { type: [string, "null"], format: uri }
        orders:
          type: array
          items: { $ref: "#/components/schemas/Order" }
      required: [orderGroupNumber, grandTotal, status, authorizationUrl, orders]
    CheckoutInput:
      type: object
      properties:
        deliveryAddress: { type: string, minLength: 8 }
        paymentMode: { type: string, enum: [sandbox, paystack] }
        email: { type: string, format: email }
      required: [deliveryAddress, paymentMode]
    PaymentMethods:
      type: object
      properties:
        sandboxAvailable: { type: boolean }
        paystackAvailable: { type: boolean }
      required: [sandboxAvailable, paystackAvailable]
    PaystackVerificationInput:
      type: object
      properties:
        reference: { type: string, minLength: 5, maxLength: 160 }
      required: [reference]
    PaymentVerification:
      type: object
      properties:
        reference: { type: string }
        status: { type: string, enum: [pending, paid, failed] }
        orderGroupNumber: { type: string }
        grandTotal: { type: number }
        orders:
          type: array
          items: { $ref: "#/components/schemas/Order" }
      required: [reference, status, orderGroupNumber, grandTotal, orders]
    SellerDashboard:
      type: object
      properties:
        productCount: { type: integer }
        activeOrders: { type: integer }
        revenueNgn: { type: number }
        stockUnits: { type: integer }
        recentOrders:
          type: array
          items: { $ref: "#/components/schemas/Order" }
      required: [productCount, activeOrders, revenueNgn, stockUnits, recentOrders]
    AdminDashboard:
      type: object
      properties:
        pendingVerifications: { type: integer }
        activeListings: { type: integer }
        flaggedPayments: { type: integer }
        openDisputes: { type: integer }
        grossMerchandiseValueNgn: { type: number }
      required: [pendingVerifications, activeListings, flaggedPayments, openDisputes, grossMerchandiseValueNgn]
    VerificationCase:
      type: object
      properties:
        id: { type: integer }
        sellerId: { type: string }
        sellerName: { type: string }
        businessName: { type: string }
        location: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        submittedAt: { type: string, format: date-time }
      required: [id, sellerId, sellerName, businessName, location, status, submittedAt]
    VerificationStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [approved, rejected]
      required: [status]
    OrderStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [processing, in_transit, delivered, cancelled]
      required: [status]
    QuotationLineInput:
      type: object
      properties:
        productId: { type: integer }
        quantity: { type: integer, minimum: 1 }
      required: [productId, quantity]
    QuotationInput:
      type: object
      properties:
        businessName: { type: string, minLength: 2 }
        notes: { type: string }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/QuotationLineInput" }
      required: [businessName, notes, items]
    QuotationItem:
      type: object
      properties:
        quotationItemId: { type: integer }
        productId: { type: integer }
        name: { type: string }
        unit: { $ref: "#/components/schemas/ProductUnit" }
        unitPrice: { type: number }
        quantity: { type: integer }
        sellerName: { type: string }
      required: [quotationItemId, productId, name, unit, unitPrice, quantity, sellerName]
    QuotationResponse:
      type: object
      properties:
        id: { type: integer }
        sellerName: { type: string }
        status: { type: string, enum: [quoted, accepted, declined] }
        totalNgn: { type: [integer, "null"] }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/QuotationResponseItem" }
      required: [id, sellerName, status, totalNgn, message, createdAt, items]
    QuotationResponseItem:
      type: object
      properties:
        quotationItemId: { type: integer }
        unitPriceNgn: { type: integer, minimum: 1 }
        quantity: { type: integer }
        name: { type: string }
        unit: { $ref: "#/components/schemas/ProductUnit" }
      required: [quotationItemId, unitPriceNgn, quantity, name, unit]
    QuotationResponseInput:
      type: object
      properties:
        status: { type: string, enum: [quoted, declined] }
        items:
          type: array
          items:
            type: object
            properties:
              quotationItemId: { type: integer }
              unitPriceNgn: { type: integer, minimum: 1 }
            required: [quotationItemId, unitPriceNgn]
        message: { type: string, maxLength: 1000 }
      required: [status, message]
    QuotationResponseUpdate:
      type: object
      properties:
        status: { type: string, enum: [accepted, declined] }
        deliveryAddress: { type: string, minLength: 8, maxLength: 1000 }
        paymentMode: { type: string, enum: [sandbox, paystack] }
        email: { type: string, format: email }
      required: [status]
    QuotationDecisionResult:
      type: object
      properties:
        quotation: { $ref: "#/components/schemas/Quotation" }
        orderGroupNumber: { type: [string, "null"] }
        status: { type: [string, "null"], enum: [pending, paid, failed, null] }
        authorizationUrl: { type: [string, "null"], format: uri }
        orders:
          type: array
          items: { $ref: "#/components/schemas/Order" }
      required: [quotation, orderGroupNumber, status, authorizationUrl, orders]
    Quotation:
      type: object
      properties:
        id: { type: integer }
        businessName: { type: string }
        status: { type: string, enum: [requested, quoted, accepted, declined] }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/QuotationItem" }
        responses:
          type: array
          items: { $ref: "#/components/schemas/QuotationResponse" }
      required: [id, businessName, status, notes, createdAt, items, responses]
    OrderDispute:
      type: object
      properties:
        id: { type: integer }
        orderId: { type: integer }
        orderNumber: { type: string }
        sellerName: { type: string }
        buyerName: { type: string }
        reason: { type: string }
        details: { type: string }
        status: { type: string, enum: [open, reviewing, resolved, rejected] }
        resolutionNote: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, orderId, orderNumber, sellerName, buyerName, reason, details, status, resolutionNote, createdAt]
    OrderDisputeInput:
      type: object
      properties:
        reason: { type: string, minLength: 3, maxLength: 120 }
        details: { type: string, minLength: 8, maxLength: 4000 }
      required: [reason, details]
    OrderDisputeUpdate:
      type: object
      properties:
        status: { type: string, enum: [reviewing, resolved, rejected] }
        resolutionNote: { type: string, maxLength: 2000 }
      required: [status, resolutionNote]

